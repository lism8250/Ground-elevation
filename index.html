<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>軀體圖高程換算工具 v2.0</title>
<style>
:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --border:#d8dee7;
  --struct:#374151;
  --ref:#2563eb;       /* 幾米線 */
  --sill:#d97706;      /* 台度 */
  --window:#059669;    /* 窗頂 */
  --finish:#7c3aed;    /* 裝修完成面 */
  --augment:#64748b;
  --danger:#b91c1c;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:#fff;border-bottom:1px solid #e5e7eb}
.header{max-width:1280px;margin:auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:19px;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{
  max-width:1280px;
  margin:auto;
  padding:16px;
  display:grid;
  grid-template-columns:minmax(340px, 46%) minmax(360px, 54%);
  gap:16px;
  align-items:start;
  height:calc(100vh - 68px);
  overflow:hidden;
}
.panel{background:var(--card);border:1px solid #e5e7eb;border-radius:var(--radius)}
/* 左側示意圖永遠固定；只有右側參數區捲動 */
.left-sticky{
  position:relative;
  height:100%;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.right{
  height:100%;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding-right:2px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.panel-head{padding:14px 16px;border-bottom:1px solid #eef0f3}
.panel-head h2,.section h2{font-size:16px;margin:0}
.help{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.diagram-wrap{flex:1;min-height:0;padding:14px;overflow:hidden}
#diagram{width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px;font-size:12px;color:#4b5563}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%}
.section{padding:15px}
.section+.section{border-top:1px solid #eef0f3}
label{display:block;font-size:13px;color:#374151;margin-bottom:5px}
input,select{
  width:100%;min-height:42px;border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:#fff;color:var(--text)
}
input:focus,select:focus{outline:2px solid #bfdbfe;border-color:#60a5fa}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.point-row{display:grid;grid-template-columns:1.2fr .8fr 44px;gap:8px;align-items:end;margin-bottom:8px}
.dim-row{display:grid;grid-template-columns:1fr .7fr 1fr .7fr 44px;gap:8px;align-items:end;margin-bottom:8px}
.icon-btn{width:44px;min-height:42px;border:1px solid #fecaca;border-radius:10px;color:var(--danger);background:#fff7f7;font-size:20px}
.btn{border:1px solid var(--border);border-radius:10px;background:#fff;min-height:42px;padding:8px 12px;font-weight:700}
.btn-primary{background:#111827;color:#fff;border-color:#111827}
.callout{border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;padding:12px 13px;line-height:1.65;font-size:14px}
.big{font-size:25px;font-weight:800;margin-top:4px}
.up{color:#047857}.down{color:#b91c1c}.same{color:#92400e}
.finish-box{background:#faf5ff;border:1px solid #e9d5ff;border-radius:12px;padding:12px}
.finish-result{margin-top:10px;font-size:13px;line-height:1.65}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap}
th{background:#fafafa;color:#4b5563}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef2f7}
.actions{display:flex;gap:8px}
.small{font-size:12px;color:var(--muted)}
.level-chip{font-weight:700}
.c-ref{color:var(--ref)} .c-sill{color:var(--sill)} .c-window{color:var(--window)} .c-finish{color:var(--finish)}
@media(max-width:760px){
  html,body{height:100%;overflow:hidden}
  header{height:58px}
  .header{padding:8px 10px;height:58px}
  h1{font-size:15px}
  .sub{font-size:10px}
  #resetBtn{font-size:12px;min-height:36px;padding:6px 8px}
  .app{
    height:calc(100vh - 58px);
    padding:4px;
    grid-template-columns:54% 46%;
    gap:4px;
    overflow:hidden;
  }
  .left-sticky{
    height:100%;
    min-height:0;
    border-radius:10px;
  }
  .right{
    height:100%;
    overflow-y:auto;
    gap:6px;
    padding-right:0;
  }
  .panel-head{padding:6px 7px}
  .panel-head h2{font-size:13px}
  .diagram-wrap{padding:2px;flex:1}
  .legend{padding:0 4px 4px;gap:4px;font-size:8px}
  .dot{width:6px;height:6px}

  #diagram{
    width:100%;
    height:100%;
  }
  .section{padding:8px}
  .section h2{font-size:13px}
  .help{font-size:10px;line-height:1.4}
  .grid2,.grid3{grid-template-columns:1fr}
  label{font-size:10px;margin-bottom:3px}
  input,select,.btn{
    min-height:38px;
    font-size:13px;
    padding:6px 7px;
    border-radius:8px;
  }
  .point-row{
    grid-template-columns:1fr .8fr 34px;
    gap:4px;
    margin-bottom:5px
  }
  .dim-row{
    grid-template-columns:1fr;
    gap:5px;
    border:1px solid #e5e7eb;
    border-radius:9px;
    padding:6px;
    margin-bottom:7px
  }
  .dim-row .icon-btn{grid-column:1;justify-self:end}
  .icon-btn{width:34px;min-height:34px;font-size:16px}
  .finish-box{padding:7px}
  .finish-result,.callout{font-size:11px}
  .big{font-size:17px}
  table{font-size:10px}
  th,td{padding:6px 5px}
}
</style>
</head>
<body>
<header>
  <div class="header">
    <div>
      <h1>軀體圖高程換算工具</h1>
      <div class="sub">v2.0｜FL 統一高程・裝修厚度補正・手機適用</div>
    </div>
    <button id="resetBtn" class="btn" style="width:auto">重設範例</button>
  </div>
</header>

<main class="app">
  <!-- 左側固定示意圖 -->
  <section class="panel left-sticky">
    <div class="panel-head">
      <h2>高程示意圖</h2>
      
    </div>
    <div class="diagram-wrap">
      <svg id="diagram" viewBox="0 0 560 760" preserveAspectRatio="xMidYMid meet" aria-label="高程垂直示意圖"></svg>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--ref)"></i>幾米線</span>
      <span><i class="dot" style="background:var(--sill)"></i>台度</span>
      <span><i class="dot" style="background:var(--window)"></i>窗頂</span>
      <span><i class="dot" style="background:var(--finish)"></i>裝修完成面</span>
    </div>
  </section>

  <!-- 右側參數 -->
  <div class="right">
    <section class="panel">
      <div class="section">
        <h2>1. 裝修厚度</h2>
        <div class="help">有增築完成面時，裝修厚度從增築面往上加；沒有增築面時，從結構完成面往上加。</div>

        <div class="finish-box" style="margin-top:12px">
          <div class="grid2">
            <div>
              <label for="finishThickness">裝修厚度（cm）</label>
              <input id="finishThickness" type="number" step="0.1" min="0" value="0">
            </div>
            <div>
              <label for="applyWindowShift">窗戶補正方式</label>
              <select id="applyWindowShift">
                <option value="shiftBoth" selected>窗台＋窗頂一起抬高（淨高不變）</option>
                <option value="topOnly">只有窗頂抬高</option>
                <option value="none">不補正窗戶</option>
              </select>
            </div>
          </div>
          <div id="finishResult" class="finish-result"></div>
        </div>
      </div>

      <div class="section">
        <h2>2. 高程點</h2>
        <div class="help">高程點是實際位置，例如：結構完成面 -6、增築完成面 +26.5、台度 +91.8、1.5 米線 +150。</div>
        <div id="points" style="margin-top:12px"></div>
        <button id="addPointBtn" class="btn" type="button">＋ 新增高程點</button>
      </div>

      <div class="section">
        <h2>3. 尺寸</h2>
        <div class="help">尺寸本身不是高程。要指定起點與方向，例如「窗高 174，從台度向上」。</div>
        <div id="dimensions" style="margin-top:12px"></div>
        <button id="addDimBtn" class="btn" type="button">＋ 新增尺寸</button>
      </div>

      <div class="section">
        <h2>4. 任選兩點計算</h2>
        <div class="grid2">
          <div>
            <label for="fromSel">起點</label>
            <select id="fromSel"></select>
          </div>
          <div>
            <label for="toSel">終點</label>
            <select id="toSel"></select>
          </div>
        </div>
        <div id="compareResult" class="callout" style="margin-top:12px" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel">
      <div class="section">
        <h2>計算結果總表</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>名稱</th><th>類型</th><th>FL 高程</th><th>來源 / 算式</th></tr></thead>
          <tbody id="resultTable"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const pointsEl = $('#points');
const dimsEl = $('#dimensions');

const makeId = () => (crypto.randomUUID ? crypto.randomUUID() : 'id_'+Math.random().toString(36).slice(2));

let state = {
  finishThickness: 0,
  applyWindowShift: 'shiftBoth',
  points: [
    {id: makeId(), name:'結構完成面', value:-6},
    {id: makeId(), name:'增築完成面', value:26.5},
    {id: makeId(), name:'台度', value:91.8},
    {id: makeId(), name:'結構1.5米線', value:150}
  ],
  dims: [
    {id: makeId(), name:'窗高', value:174, startName:'台度', direction:'up'}
  ]
};

function num(v){ const n=parseFloat(v); return Number.isFinite(n)?n:0; }
function fmt(v){
  const n=Number(v);
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
}
function signFmt(v){ const n=Number(v); return `${n>=0?'+':''}${fmt(n)}`; }
function esc(s=''){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

function classify(name){
  const n=(name||'').toLowerCase();
  if(n.includes('米線') || n.includes('100線') || n.includes('150線')) return 'ref';
  if(n.includes('台度') || n.includes('窗台')) return 'sill';
  if(n.includes('窗頂')) return 'window';
  if(n.includes('裝修')) return 'finish';
  if(n.includes('增築')) return 'augment';
  return 'normal';
}

function colorFor(kind){
  const styles=getComputedStyle(document.documentElement);
  const map={
    ref:styles.getPropertyValue('--ref').trim(),
    sill:styles.getPropertyValue('--sill').trim(),
    window:styles.getPropertyValue('--window').trim(),
    finish:styles.getPropertyValue('--finish').trim(),
    augment:styles.getPropertyValue('--augment').trim(),
    normal:styles.getPropertyValue('--struct').trim()
  };
  return map[kind] || map.normal;
}

function getPoint(name){ return state.points.find(p=>p.name===name); }

function finishBasePoint(){
  const augment = state.points.find(p => /增築.*完成面|增築完成面/.test(p.name));
  if(augment) return augment;
  return state.points.find(p => /結構.*完成面|結構完成面/.test(p.name)) || state.points[0] || null;
}

function renderInputs(){
  $('#finishThickness').value = state.finishThickness;
  $('#applyWindowShift').value = state.applyWindowShift;

  pointsEl.innerHTML='';
  state.points.forEach(p=>{
    const row=document.createElement('div');
    row.className='point-row';
    row.innerHTML=`
      <div><label>名稱</label><input data-p="${p.id}" data-k="name" value="${esc(p.name)}"></div>
      <div><label>FL 高程（cm）</label><input type="number" step="0.1" data-p="${p.id}" data-k="value" value="${p.value}"></div>
      <button type="button" class="icon-btn" data-del-p="${p.id}" aria-label="刪除高程">×</button>`;
    pointsEl.appendChild(row);
  });

  dimsEl.innerHTML='';
  const opts=state.points.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
  state.dims.forEach(d=>{
    const row=document.createElement('div');
    row.className='dim-row';
    row.innerHTML=`
      <div><label>尺寸名稱</label><input data-d="${d.id}" data-k="name" value="${esc(d.name)}"></div>
      <div><label>尺寸（cm）</label><input type="number" step="0.1" data-d="${d.id}" data-k="value" value="${d.value}"></div>
      <div><label>起點</label><select data-d="${d.id}" data-k="startName">${opts}</select></div>
      <div><label>方向</label><select data-d="${d.id}" data-k="direction">
        <option value="up">向上</option><option value="down">向下</option>
      </select></div>
      <button type="button" class="icon-btn" data-del-d="${d.id}" aria-label="刪除尺寸">×</button>`;
    dimsEl.appendChild(row);
    row.querySelector('[data-k="startName"]').value=d.startName;
    row.querySelector('[data-k="direction"]').value=d.direction;
  });

  bindInputs();
  calculate();
}

function bindInputs(){
  document.querySelectorAll('[data-p]').forEach(el=>{
    el.addEventListener('input',e=>{
      const p=state.points.find(x=>x.id===e.target.dataset.p);
      p[e.target.dataset.k]=e.target.dataset.k==='value'?num(e.target.value):e.target.value;
      validateDimensionStarts();
      calculate();
    });
  });
  document.querySelectorAll('[data-d]').forEach(el=>{
    const handler=e=>{
      const d=state.dims.find(x=>x.id===e.target.dataset.d);
      d[e.target.dataset.k]=e.target.dataset.k==='value'?num(e.target.value):e.target.value;
      calculate();
    };
    el.addEventListener('input',handler); el.addEventListener('change',handler);
  });
  document.querySelectorAll('[data-del-p]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.points=state.points.filter(x=>x.id!==btn.dataset.delP);
      validateDimensionStarts();
      renderInputs();
    });
  });
  document.querySelectorAll('[data-del-d]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.dims=state.dims.filter(x=>x.id!==btn.dataset.delD);
      renderInputs();
    });
  });
}

function validateDimensionStarts(){
  state.dims.forEach(d=>{
    if(!state.points.some(p=>p.name===d.startName)) d.startName=state.points[0]?.name||'';
  });
}

function inferEndName(name,direction){
  const n=(name||'').trim();
  if(n.includes('窗高')) return direction==='up'?'窗頂':'窗底';
  if(n.includes('門高')) return direction==='up'?'門頂':'門底';
  if(n.includes('樑深')) return direction==='down'?'樑底':'樑頂';
  return `${n||'尺寸'}終點`;
}

function buildLevels(){
  const t=num(state.finishThickness);
  const levels=[];
  const windowShift = state.applyWindowShift;

  // 原始高程點；若選擇「窗台＋窗頂一起抬高」，台度顯示補正後高程
  state.points.forEach(p=>{
    let elevation=num(p.value);
    let source='直接輸入';
    if(classify(p.name)==='sill' && windowShift==='shiftBoth' && t!==0){
      elevation += t;
      source=`原台度 ${signFmt(p.value)} + 裝修 ${fmt(t)}`;
    }
    levels.push({
      key:'p_'+p.id,
      name:p.name||'未命名高程',
      elevation,
      type:'高程點',
      source,
      kind:classify(p.name)
    });
  });

  // 裝修完成面
  const base=finishBasePoint();
  if(base && t!==0){
    levels.push({
      key:'finish',
      name:'裝修完成面',
      elevation:num(base.value)+t,
      type:'裝修',
      source:`${base.name} ${signFmt(base.value)} + ${fmt(t)}`,
      kind:'finish'
    });
  }

  // 尺寸換算
  state.dims.forEach(d=>{
    const rawStart=getPoint(d.startName);
    if(!rawStart) return;

    let startElevation=num(rawStart.value);
    const startIsSill=classify(rawStart.name)==='sill';
    if(startIsSill && windowShift==='shiftBoth') startElevation += t;

    let elevation=startElevation + (d.direction==='up'?num(d.value):-num(d.value));
    let source=`${rawStart.name} ${signFmt(startElevation)} ${d.direction==='up'?'+':'-'} ${fmt(d.value)}`;

    // topOnly：只有由窗高得到的窗頂再加裝修厚度
    const endName=inferEndName(d.name,d.direction);
    if(endName==='窗頂' && windowShift==='topOnly'){
      elevation += t;
      source += ` + 裝修 ${fmt(t)}`;
    }

    levels.push({
      key:'d_'+d.id,
      name:endName,
      elevation,
      type:'尺寸換算',
      source,
      kind:classify(endName)
    });
  });

  return levels;
}

function renderFinishInfo(levels){
  const t=num(state.finishThickness);
  const base=finishBasePoint();
  const box=$('#finishResult');
  if(!base){
    box.innerHTML='找不到「結構完成面」或「增築完成面」，無法建立裝修完成面。';
    return;
  }
  const finishElev=num(base.value)+t;
  let windowText='';
  if(state.applyWindowShift==='shiftBoth'){
    windowText='窗台與窗頂會一起抬高相同厚度，因此窗戶淨高維持不變。';
  }else if(state.applyWindowShift==='topOnly'){
    windowText='只有窗頂抬高，窗戶淨高會增加裝修厚度。';
  }else{
    windowText='裝修厚度只建立完成面，不補正窗戶位置。';
  }
  box.innerHTML=`
    裝修基準：<strong>${esc(base.name)}</strong> FL ${signFmt(base.value)}<br>
    裝修完成面：<strong class="c-finish">FL ${signFmt(finishElev)}</strong><br>
    ${windowText}`;
}

function calculate(){
  state.finishThickness=num($('#finishThickness').value);
  state.applyWindowShift=$('#applyWindowShift').value;
  const levels=buildLevels().sort((a,b)=>b.elevation-a.elevation);
  renderFinishInfo(levels);
  renderTable(levels);
  renderDiagram(levels);
  renderSelectors(levels);
}

function renderTable(levels){
  const tb=$('#resultTable'); tb.innerHTML='';
  levels.forEach(x=>{
    const cls='c-'+x.kind;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><strong class="${cls}">${esc(x.name)}</strong></td>
      <td><span class="badge">${esc(x.type)}</span></td>
      <td>FL ${signFmt(x.elevation)}</td>
      <td>${esc(x.source)}</td>`;
    tb.appendChild(tr);
  });
}

function svgEl(tag,attrs={},text=''){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  if(text) el.textContent=text;
  return el;
}

function renderDiagram(levels){
  const svg=$('#diagram'); svg.innerHTML='';
  if(!levels.length) return;

  const mobile = window.matchMedia('(max-width:760px)').matches;
  const W=mobile ? 430 : 560;
  const H=760, padTop=48, padBottom=48;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const max=levels[0].elevation,min=levels[levels.length-1].elevation;
  const span=Math.max(1,max-min);
  const yOf=e=>padTop+((max-e)/span)*(H-padTop-padBottom);

  const axisX = mobile ? 34 : 85;
  const lineEnd = mobile ? 405 : 510;
  const labelX = mobile ? 45 : 98;
  const measureX = mobile ? 330 : 455;
  const measureTextX = mobile ? 340 : 467;
  const nameSize = mobile ? 21 : 16;
  const elevSize = mobile ? 18 : 14;
  const diffSize = mobile ? 16 : 13;

  svg.appendChild(svgEl('line',{x1:axisX,y1:28,x2:axisX,y2:H-28,stroke:'#9ca3af','stroke-width':mobile?'3':'2'}));

  levels.forEach((x,i)=>{
    const y=yOf(x.elevation);
    const color=colorFor(x.kind);
    svg.appendChild(svgEl('line',{x1:axisX,y1:y,x2:lineEnd,y2:y,stroke:color,'stroke-width':x.kind==='ref'||x.kind==='sill'?(mobile?6:4):(mobile?4:3)}));
    svg.appendChild(svgEl('circle',{cx:axisX,cy:y,r:mobile?8:6,fill:color}));
    svg.appendChild(svgEl('text',{x:labelX,y:y-10,fill:color,'font-size':nameSize,'font-weight':'700'},x.name));
    svg.appendChild(svgEl('text',{x:labelX,y:y+18,fill:'#374151','font-size':elevSize,'font-weight':mobile?'600':'400'},`FL ${signFmt(x.elevation)}`));

    if(i<levels.length-1){
      const y2=yOf(levels[i+1].elevation);
      const mid=(y+y2)/2;
      const diff=x.elevation-levels[i+1].elevation;
      svg.appendChild(svgEl('line',{x1:measureX,y1:y+8,x2:measureX,y2:y2-8,stroke:'#9ca3af','stroke-width':mobile?'2':'1.5','stroke-dasharray':'5 5'}));
      svg.appendChild(svgEl('text',{x:measureTextX,y:mid+5,fill:'#374151','font-size':diffSize,'font-weight':mobile?'600':'400'},`${fmt(diff)} cm`));
    }
  });
}

function renderSelectors(levels){
  const from=$('#fromSel'),to=$('#toSel');
  const prevFrom=from.value,prevTo=to.value;
  const opts=levels.map((x,i)=>`<option value="${i}">${esc(x.name)}｜FL ${signFmt(x.elevation)}</option>`).join('');
  from.innerHTML=opts;to.innerHTML=opts;
  if(levels.length>1){
    from.value=(prevFrom!=='' && levels[Number(prevFrom)])?prevFrom:String(levels.length-1);
    to.value=(prevTo!=='' && levels[Number(prevTo)])?prevTo:'0';
  }
  const update=()=>renderCompare(levels);
  from.onchange=update;to.onchange=update;renderCompare(levels);
}

function renderCompare(levels){
  const box=$('#compareResult');
  if(!levels.length){box.textContent='尚無資料';return}
  const a=levels[Number($('#fromSel').value)]||levels[0];
  const b=levels[Number($('#toSel').value)]||levels[0];
  const diff=b.elevation-a.elevation;
  const dir=diff>0?'往上':diff<0?'往下':'同高程';
  const cls=diff>0?'up':diff<0?'down':'same';
  box.innerHTML=`
    從 <strong>${esc(a.name)}</strong>（FL ${signFmt(a.elevation)}）<br>
    到 <strong>${esc(b.name)}</strong>（FL ${signFmt(b.elevation)}）<br>
    ${signFmt(b.elevation)} - (${signFmt(a.elevation)}) = <strong>${fmt(Math.abs(diff))} cm</strong>
    <div class="big ${cls}">${dir} ${fmt(Math.abs(diff))} cm</div>`;
}

$('#finishThickness').addEventListener('input',calculate);
$('#applyWindowShift').addEventListener('change',calculate);

$('#addPointBtn').addEventListener('click',()=>{
  state.points.push({id:makeId(),name:'新高程',value:0});
  renderInputs();
});
$('#addDimBtn').addEventListener('click',()=>{
  state.dims.push({id:makeId(),name:'新尺寸',value:0,startName:state.points[0]?.name||'',direction:'up'});
  renderInputs();
});
$('#resetBtn').addEventListener('click',()=>{
  state={
    finishThickness:0,
    applyWindowShift:'shiftBoth',
    points:[
      {id:makeId(),name:'結構完成面',value:-6},
      {id:makeId(),name:'增築完成面',value:26.5},
      {id:makeId(),name:'台度',value:91.8},
      {id:makeId(),name:'結構1.5米線',value:150}
    ],
    dims:[{id:makeId(),name:'窗高',value:174,startName:'台度',direction:'up'}]
  };
  renderInputs();
});

renderInputs();

let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(calculate,120);
});
</script>
</body>
</html>
